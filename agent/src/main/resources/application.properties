spring.application.name=agent
spring.profiles.active=amazon,ecommerce

# --- Distributed tracing + OpenTelemetry logs -> Loki ---
management.tracing.sampling.probability=1.0
# No OTLP collector is running; set OTLP_METRICS_ENABLED=true once one exists
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
# Set TRACE_EXPORT_ENABLED=true and OTEL_TRACES_ENDPOINT once Tempo/Jaeger exists (Loki stores logs only)
management.tracing.export.enabled=${TRACE_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Loki's native OTLP ingestion endpoint
management.opentelemetry.logging.export.otlp.endpoint=${LOKI_OTLP_ENDPOINT:http://localhost:3100/otlp/v1/logs}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
# Put traceId/spanId in console logs and MDC
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020

# --- OAuth2 Resource Server ---
# This app now only accepts requests carrying a valid JWT access token issued by an
# external OAuth2/OIDC authorization server. Once that server exists, set ONE of:
#   1) issuer-uri  (preferred - enables OIDC discovery of the JWK set automatically)
#      spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-auth-server.example.com
#   2) jwk-set-uri (if the auth server has no discovery endpoint)
#      spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://your-auth-server.example.com/.well-known/jwks.json
# Values are read from environment variables so the app can start without a hardcoded URL.
# Defaults point at the local ecommerce-auth-server (client_credentials-only, port 9000).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWK_SET_URI:}

# --- Micrometer / Prometheus metrics ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}