spring.application.name=ecommerece-rag-service
server.port=8081


app.sqlite-vec.database-url=jdbc:sqlite:./data/ecommerce-rag.db
app.sqlite-vec.enabled=true
# Must match the Ollama embedding model's length (nomic-embed-text = 768).
app.sqlite-vec.dimensions=768
# Set to the extracted vec0 native library for the deployment platform, for example:
app.sqlite-vec.extension-path=C:/tools/sqlite-vec/vec0.dll

app.rag.ollama.base-url=http://localhost:11434
# Use a local embedding model. Cloud chat models (e.g. gemma4:31b-cloud) do not support /api/embed.
app.rag.ollama.model=nomic-embed-text
# Optional for cloud chat models only: APP_RAG_OLLAMA_API_KEY / OLLAMA_API_KEY or app.rag.ollama.api-key
app.rag.ollama.batch-size=32
spring.datasource.url=jdbc:mysql://localhost:3307/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=admin
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Micrometer / Prometheus metrics ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

# --- Distributed tracing + OpenTelemetry logs -> Loki ---
management.tracing.sampling.probability=1.0
# No OTLP collector is running; set OTLP_METRICS_ENABLED=true once one exists
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
# Set TRACE_EXPORT_ENABLED=true and OTEL_TRACES_ENDPOINT once Tempo/Jaeger exists (Loki stores logs only)
management.tracing.export.enabled=${TRACE_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Loki's native OTLP ingestion endpoint
management.opentelemetry.logging.export.otlp.endpoint=${LOKI_OTLP_ENDPOINT:http://localhost:3100/otlp/v1/logs}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
# Put traceId/spanId in console logs and MDC
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020
