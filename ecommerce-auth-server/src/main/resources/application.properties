spring.application.name=ecommerce-auth-server
spring.datasource.url=jdbc:mysql://localhost:3307/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=admin
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${SERVER_PORT:9000}

# --- Distributed tracing + OpenTelemetry logs -> Loki ---
management.tracing.sampling.probability=1.0
# No OTLP collector is running; set OTLP_METRICS_ENABLED=true once one exists
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
# Set TRACE_EXPORT_ENABLED=true and OTEL_TRACES_ENDPOINT once Tempo/Jaeger exists (Loki stores logs only)
management.tracing.export.enabled=${TRACE_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Loki's native OTLP ingestion endpoint
management.opentelemetry.logging.export.otlp.endpoint=${LOKI_OTLP_ENDPOINT:http://localhost:3100/otlp/v1/logs}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
# Put traceId/spanId in console logs and MDC
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020

# --- OAuth2 Authorization Server (client_credentials only) ---
# Public URL other services use to reach this server; also embedded as the "iss" claim
# in issued tokens. Must exactly match what the resource server's issuer-uri expects.
oauth.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}

# Credentials for the single machine-to-machine client (e.g. the "agent" app or a
# Postman client) that requests tokens via POST /oauth2/token
# (grant_type=client_credentials, scope=agent.read agent.write) using HTTP Basic auth.
oauth.client.id=${OAUTH_CLIENT_ID:agent-client}
oauth.client.secret=${OAUTH_CLIENT_SECRET:{noop}}

# Second machine client used by the springboot-mcp-server to obtain its own token
# (client_credentials, scope=agent.read agent.write) when calling this "agent" API on
# behalf of MCP tool invocations.
oauth.mcp-client.id=${OAUTH_MCP_CLIENT_ID:mcp-server-client}
oauth.mcp-client.secret=${OAUTH_MCP_CLIENT_SECRET:{noop}}

# Third machine client used by the AI Agent to call the MCP server.
oauth.ai-agent.id=${OAUTH_AI_AGENT_ID:mcp-agent-client}
oauth.ai-agent.secret=${OAUTH_AI_AGENT_SECRET:{noop}}


# --- Micrometer / Prometheus metrics ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}
