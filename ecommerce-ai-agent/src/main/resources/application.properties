spring.application.name=ecommerce-ai-agent
server.port=8085

# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma4:31b-cloud

# RAG service
rag.server.url=http://localhost:8081

# OAuth2 Client Configuration for MCP Server
spring.security.oauth2.client.registration.mcp-server.client-id=agent-client
spring.security.oauth2.client.registration.mcp-server.client-secret=agent-secret
spring.security.oauth2.client.registration.mcp-server.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.mcp-server.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.provider.mcp-server.jwk-set-uri=http://localhost:9000/oauth2/jwks

# MCP Streamable HTTP client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.ecommerce.url=http://localhost:8090
spring.ai.mcp.client.streamable-http.connections.ecommerce.endpoint=/mcp

# --- Micrometer / Prometheus metrics ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

# --- Distributed tracing + OpenTelemetry logs -> Loki ---
management.tracing.sampling.probability=1.0
# No OTLP collector is running; set OTLP_METRICS_ENABLED=true once one exists
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
# Set TRACE_EXPORT_ENABLED=true and OTEL_TRACES_ENDPOINT once Tempo/Jaeger exists (Loki stores logs only)
management.tracing.export.enabled=${TRACE_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Loki's native OTLP ingestion endpoint
management.opentelemetry.logging.export.otlp.endpoint=${LOKI_OTLP_ENDPOINT:http://localhost:3100/otlp/v1/logs}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
# Put traceId/spanId in console logs and MDC
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020

chat.memory.max-messages=50
spring.ai.ollama.chat.options.num-ctx=50000

# Daily product and inventory report email (same environment variables as the agent app)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:wadekaranup@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}
amazon.order.email.to=${AMAZON_ORDER_EMAIL_TO:shvetawadhekar@gmail.com}
amazon.order.email.from=${MAIL_FROM:${MAIL_USERNAME:wadekaranup@gmail.com}}

product-inventory-report.schedule.cron=${PRODUCT_INVENTORY_REPORT_CRON:0 38 10 * * *}
product-inventory-report.schedule.zone=${PRODUCT_INVENTORY_REPORT_ZONE:Asia/Kolkata}
