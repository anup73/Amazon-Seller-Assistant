spring.application.name=springboot-mcp-server
server.port=${SERVER_PORT:8090}

# --- MCP server (Streamable HTTP / SSE) ---
spring.ai.mcp.server.name=amazon-orders-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# --- Inbound auth: this app is a resource server, validating Bearer tokens issued by
# the ecommerce-auth-server against every MCP request. ---
# spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:9000}

# --- Outbound auth: this app is also an OAuth2 client, using client_credentials to
# fetch its own token when calling the agent API service. ---
spring.security.oauth2.client.registration.agent-api.client-id=${OAUTH_MCP_CLIENT_ID:mcp-server-client}
spring.security.oauth2.client.registration.agent-api.client-secret=${OAUTH_MCP_CLIENT_SECRET:mcp-server-secret}
spring.security.oauth2.client.registration.agent-api.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.agent-api.scope=agent.read,agent.write
spring.security.oauth2.client.provider.agent-api.token-uri=${OAUTH_TOKEN_URI:http://localhost:9000/oauth2/token}

# Base URL of the agent service that exposes /api/amazon/**.
agent.api.base-url=${AGENT_API_BASE_URL:http://localhost:8080}

# --- Micrometer / Prometheus metrics ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.metrics.tags.application=${spring.application.name}

# --- Distributed tracing + OpenTelemetry logs -> Loki ---
management.tracing.sampling.probability=1.0
# No OTLP collector is running; set OTLP_METRICS_ENABLED=true once one exists
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
# Set TRACE_EXPORT_ENABLED=true and OTEL_TRACES_ENDPOINT once Tempo/Jaeger exists (Loki stores logs only)
management.tracing.export.enabled=${TRACE_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Loki's native OTLP ingestion endpoint
management.opentelemetry.logging.export.otlp.endpoint=${LOKI_OTLP_ENDPOINT:http://localhost:3100/otlp/v1/logs}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
# Put traceId/spanId in console logs and MDC
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]\u0020
